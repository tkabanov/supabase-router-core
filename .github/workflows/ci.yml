name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # fmt check, deno lint, ESLint complexity rules, type check, unit tests
      - run: deno task ci
      - run: deno publish --dry-run
